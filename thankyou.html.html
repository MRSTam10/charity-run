<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Run to Mei Shan cum little Tam Tam Charity Challenge</title>
<style>
  :root {
    --primary-color: #00a88f;
    --primary-dark: #007a68;
    --accent-color: #2c3e50;
    --bg-color: #f4fbf9;
    --card-bg: #ffffff;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--accent-color);
    margin: 0;
    padding: 0;
    line-height: 1.6;
  }

  .header-banner {
    background: linear-gradient(135deg, #007a68 0%, #00a88f 100%);
    color: white;
    text-align: center;
    padding: 40px 20px;
  }

  .header-banner h1 {
    margin: 0 0 15px 0;
    font-size: 22pt;
    line-height: 1.3;
    font-weight: normal;
  }

  .header-banner h1 .title-line-1 { font-weight: bold; display: block; }
  .header-banner h1 .title-line-2 { font-weight: normal; display: block; }
  .header-banner h1 .title-line-3 { font-weight: bold; display: block; }

  .header-banner p {
    margin: 0;
    font-size: 14pt;
    opacity: 0.95;
  }

  .header-banner p .zh-bold { font-weight: bold; }
  .header-banner p .zh-normal { font-weight: normal; }

  .container {
    max-width: 650px;
    margin: -20px auto 40px auto;
    padding: 0 20px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 40px 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    text-align: center;
  }

  .icon-circle {
    width: 80px;
    height: 80px;
    background-color: #e8f8f5;
    color: var(--primary-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin: 0 auto 20px auto;
  }

  .section-title {
    font-size: 18pt;
    font-weight: bold;
    color: var(--primary-color);
    margin-bottom: 15px;
  }

  .message {
    font-size: 11pt;
    color: #555;
    margin-bottom: 30px;
  }

  .btn-container {
    text-align: center;
  }

  .home-btn {
    display: inline-block;
    background-color: var(--primary-color);
    color: white;
    padding: 14px 32px;
    font-size: 12pt;
    font-weight: bold;
    text-decoration: none;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 168, 143, 0.3);
    transition: all 0.3s ease;
  }

  .home-btn:hover {
    background-color: var(--primary-dark);
    transform: translateY(-2px);
  }
</style>
</head>
<body>

<div class="header-banner">
  <h1>
    <span class="title-line-1">Run to Mei Shan</span>
    <span class="title-line-2">cum</span>
    <span class="title-line-3">little Tam Tam Charity Challenge</span>
  </h1>
  <p>
    <span class="zh-bold">走進美山</span><span class="zh-normal">暨</span><span class="zh-bold">小謙謙慈善挑戰賽</span>
  </p>
</div>

<div class="container">
  <div class="card">
    <div class="icon-circle">✓</div>
    <div class="section-title">Registration Submitted!<br>報名資料已成功提交！</div>
    
    <div class="message">
      <p>感謝您參加「走進美山暨小謙謙慈善挑戰賽」。</p>
      <p>我們已收到您的報名資料，核對無誤後將會透過電郵與您聯絡確認手續。</p>
      <p style="font-size: 10pt; color: #888; margin-top: 15px;">Thank you for your warm support to little Tam Tam!</p>
    </div>

    <div class="btn-container">
      <a href="index.html" class="home-btn">返回賽事主頁 (Return to Homepage)</a>
    </div>
  </div>
</div>

</body>
</html>
